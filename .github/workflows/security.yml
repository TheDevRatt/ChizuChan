name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test credential scanner
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Verify tracked files contain no credentials
        run: python3 scripts/verify_no_secrets.py

  youtube-download-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Run YouTube download tests
        run: dotnet test tests/ChizuChan.YouTubeDownload.Tests/ChizuChan.YouTubeDownload.Tests.csproj --configuration Release --verbosity minimal

  long-media-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Install offline media-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg python3
          ffmpeg -version
          ffprobe -version
          python3 --version
      - name: Run long-media acceptance regressions (no upstream downloads)
        run: dotnet test tests/ChizuChan.LongMedia.Regression.Tests/ChizuChan.LongMedia.Regression.Tests.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=long-media.trx" --results-directory TestResults/long-media
      - name: Retain test evidence even when acceptance is RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: long-media-test-results
          path: TestResults/long-media
          if-no-files-found: error
          retention-days: 14
